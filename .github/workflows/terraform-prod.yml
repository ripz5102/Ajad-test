
name: Terraform Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Review Production Plan  # CHANGED
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    permissions:
      contents: read
      id-token: write

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PROD_PLAN_CLIENT_ID }} # CHANGED
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Azure Login - Production Planning Identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PROD_PLAN_CLIENT_ID }} # CHANGED
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise Production Backend
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Generate saved plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=2m \
            -out=tfplan

      # ADDED - Reject deletion and replacement actions
      - name: Block destructive changes
        run: |
          terraform show -json tfplan | jq -e '
            [.resource_changes[]?
             | select(.change.actions | index("delete"))]
            | length == 0
          '

      - name: Plan summary
        run: |
          echo "### Terraform Production Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the Generate saved plan logs before approving deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: production-plan
          path: environments/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply Production Plan  # CHANGED
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment: production  # CHANGED - Approval gate
    defaults:
      run:
        working-directory: environments/prod

    permissions:
      contents: read
      id-token: write

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PROD_CLIENT_ID }} # CHANGED
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: production-plan
          path: environments/prod

      - name: Azure Login - Production Deployment Identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }} # CHANGED
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise Production Backend
        run: terraform init -input=false

      - name: Apply saved plan
        run: terraform apply -input=false -lock-timeout=2m tfplan

      - name: Verify Production VNet # CHANGED
        run: terraform state show 'module.network.azurerm_virtual_network.vnet'
