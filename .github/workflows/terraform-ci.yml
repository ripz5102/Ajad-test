name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          
      - name: Format Terraform
        run: terraform fmt -check -recursive
      - name: Initialise Terraform
        run: terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform validate -no-color
  plan:
    name: Terraform Azure Plan
    runs-on: ubuntu-latest
    needs: validate

    # Run only on trusted PRs from this repository and your account.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ripz5102'

    permissions:
      contents: read
      id-token: write

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise Terraform Remote Backend
        run: terraform init -input=false

      - name: Generate Terraform Plan and Summary
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=2m \
            -detailed-exitcode \
            -var-file="environments/dev.tfvars"

          EXIT_CODE=$?
          set -e

          case "$EXIT_CODE" in
            0)
              echo "### Terraform Plan: No changes" >> "$GITHUB_STEP_SUMMARY"
              echo "Azure development infrastructure matches the configuration." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "### Terraform Plan: Changes proposed" >> "$GITHUB_STEP_SUMMARY"
              echo "Review the Terraform plan in the job logs before approving deployment." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### Terraform Plan: Failed" >> "$GITHUB_STEP_SUMMARY"
              echo "Investigate the Terraform errors in the job logs." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac