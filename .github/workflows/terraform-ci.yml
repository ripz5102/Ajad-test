name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          
      - name: Format Terraform
        run: terraform fmt -check -recursive
      - name: Initialise Terraform
        run: terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform validate -no-color
  plan:
    name: Terraform Azure Plan
    runs-on: ubuntu-latest
    needs: validate

    # Run only on trusted PRs from this repository and your account.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ripz5102'

    permissions:
      contents: read
      id-token: write

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialise Terraform Remote Backend
        run: terraform init -input=false

      - name: Generate Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=2m -var-file="environments/dev.tfvars"